          title: Abnormal Sec
          description: 비정상 시간 (나쁜 자세가 하나라도 확정)
        unknown_sec:
          type: number
          title: Unknown Sec
          description: 판단 못 한 시간 (카메라 미인식·켜는 중, 기준 측정 전, 5초 미만 자리 비움)
