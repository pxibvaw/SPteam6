# 자동 생성 파일 — 직접 고치지 말고 hardware/server/schemas.py를 고친 뒤
#   python -m hardware.server.mock_server --export-openapi
openapi: 3.1.0
info:
  title: SitSense API (mock)
  description: 'Raspberry Pi 서버 → 안드로이드 앱. 같은 Wi-Fi에서 `http://<Pi IP>:8000`.


    지금은 **mock 서버**: 시나리오 더미 데이터와 가짜 판단 결과를 준다. 시각은 time.time() 초, 거리 mm, 각도 °, 비율
    0~1. 표시용 글자는 앱이 만든다. 영상 이미지는 어떤 응답에도 없다.'
  version: 0.1.0-mock
paths:
  /status:
    get:
      tags:
      - 기기
      summary: 서버·센서 상태
      operationId: status_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /current:
    get:
      tags:
      - 자세
      summary: 지금 자세 (1~3초마다 호출)
      operationId: current_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Current'
        '404':
          description: 아직 기록 없음
  /history:
    get:
      tags:
      - 자세
      summary: 최근 판단 기록 (1초에 1개)
      operationId: history_history_get
      parameters:
      - name: seconds
        in: query
        required: false
        schema:
          type: integer
          maximum: 3600
          minimum: 1
          description: 최근 몇 초
          default: 60
          title: Seconds
        description: 최근 몇 초
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /seating:
    get:
      tags:
      - 착석
      summary: 지금 착석 구간 (자리 비움 5초 규칙, 정상/비정상/unknown)
      operationId: seating_seating_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seating'
  /seating/segments:
    get:
      tags:
      - 착석
      summary: 끝난 착석 구간 목록
      operationId: seating_segments_seating_segments_get
      parameters:
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 48
          minimum: 1
          description: 최근 몇 시간 안에 끝난 구간
          default: 24
          title: Hours
        description: 최근 몇 시간 안에 끝난 구간
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatingSegments'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /baseline:
    get:
      tags:
      - 기준 자세
      summary: 기준(바른) 자세 측정값
      operationId: baseline_baseline_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Baseline'
  /calibrate:
    post:
      tags:
      - 기준 자세
      summary: 기준 자세 측정 (앉으면 10초). 세션 없이(온보딩) 또는 세션 중(설정의 다시 측정)
      operationId: calibrate_calibrate_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrateResult'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /time/sync:
    post:
      tags:
      - 시각
      summary: 앱 시각·시간대 보내기 (연결할 때, 세션 시작 전마다)
      operationId: time_sync_time_sync_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeSync'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeStatus'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /time:
    get:
      tags:
      - 시각
      summary: 시각 동기화 상태 (boot_id가 바뀌었거나 synced=false면 다시 동기화)
      operationId: time_status_time_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeStatus'
  /session:
    get:
      tags:
      - 세션
      summary: 세션 상태·경과 시간·센서 전원
      operationId: session_status_session_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
  /session/start:
    post:
      tags:
      - 세션
      summary: 측정 시작 (시각 동기화 후에만). 기준 자세 측정부터
      operationId: session_start_session_start_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/pause:
    post:
      tags:
      - 세션
      summary: '일시정지: 기록·판단 멈춤, 카메라·거리 끔 (착석 구간은 여기서 끝)'
      operationId: session_pause_session_pause_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/resume:
    post:
      tags:
      - 세션
      summary: 재개
      operationId: session_resume_session_resume_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/stop:
    post:
      tags:
      - 세션
      summary: '정지: 세션 끝, 센서 모두 끔 (앉아도 자동으로 다시 시작하지 않음)'
      operationId: session_stop_session_stop_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/home:
    get:
      tags:
      - 리포트
      summary: '홈 요약: 정상 비율·총 착석·하루 평균 자세·좌우 편향·목표 4종 오늘/어제'
      operationId: report_home_reports_home_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD (기본 오늘, 한국 시간)
          title: Date
        description: YYYY-MM-DD (기본 오늘, 한국 시간)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeReport'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: DB 없이 켠 서버 (NO_DB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/daily:
    get:
      tags:
      - 리포트
      summary: 일간 리포트 (지난 날은 자정 요약, 오늘은 실시간)
      operationId: report_daily_reports_daily_get
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          description: YYYY-MM-DD (한국 시간)
          title: Date
        description: YYYY-MM-DD (한국 시간)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: DB 없이 켠 서버 (NO_DB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/weekly:
    get:
      tags:
      - 리포트
      summary: 주간 리포트 (월~일, 지난주 비교, 시간대별 패턴)
      operationId: report_weekly_reports_weekly_get
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
          description: 그 주의 아무 날 YYYY-MM-DD (월요일로 맞춤)
          title: Start
        description: 그 주의 아무 날 YYYY-MM-DD (월요일로 맞춤)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReport'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: DB 없이 켠 서버 (NO_DB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/goals:
    get:
      tags:
      - 리포트
      summary: 목표·피드백 카드 4종 (오늘·어제·지난주 평균·최근 7일·추세·주된 방향)
      operationId: report_goals_reports_goals_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD (기본 오늘)
          title: Date
        description: YYYY-MM-DD (기본 오늘)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalsReport'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: DB 없이 켠 서버 (NO_DB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /layout:
    get:
      tags:
      - 기기
      summary: 센서 배치 (채널별 위치). /current의 pressure·pressure_ratio 순서와 같음
      operationId: layout_layout_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
  /records/reset:
    post:
      tags:
      - 기록
      summary: 기록 초기화 (설정·기준 자세는 유지). 세션이 없을 때만, 확인 문구 필요
      operationId: records_reset_records_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordsReset'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsResetResult'
        '409':
          description: 지금 상태에서 할 수 없음 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 잘못된 값 (detail.code 참고)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /mock/scenarios:
    get:
      tags:
      - mock 전용
      summary: 시나리오 목록
      operationId: scenarios_mock_scenarios_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ScenarioInfo'
                type: array
                title: Response Scenarios Mock Scenarios Get
  /mock/scenario:
    post:
      tags:
      - mock 전용
      summary: 재생할 시나리오 바꾸기 (기준 자세부터 다시 시작)
      operationId: select_scenario_mock_scenario_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioSelect'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioInfo'
        '404':
          description: 없는 시나리오
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Baseline:
      properties:
        state:
          $ref: '#/components/schemas/BaselineState'
          description: none 측정 전 / measuring 측정 중 / ready 완료
        remaining_sec:
          anyOf:
          - type: number
          - type: 'null'
          title: Remaining Sec
          description: 측정 중이면 남은 초
        waiting_seat:
          type: boolean
          title: Waiting Seat
          description: 측정을 요청했지만 앉기를 기다리는 중 (이때 state는 measuring)
          default: false
        created_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Created At
          description: 기준값을 만든 시각
        seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Seconds
          description: 측정 시간
        pressure:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Pressure
          description: 채널별 평균 압력
        distance_mm:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance Mm
          description: 기준 화면 거리 (중앙값)
        pose:
          anyOf:
          - additionalProperties:
              items:
                type: number
              type: array
            type: object
          - type: 'null'
          title: Pose
          description: 부위 7개의 평균 좌표 [x, y, z, visibility] (0~1 비율, 영상 아님)
      type: object
      required:
      - state
      title: Baseline
      description: 기준(바른) 자세 측정값. 측정 중에도 이전 기준값을 준다
    BaselinePhase:
      type: string
      enum:
      - none
      - waiting_seat
      - measuring
      - ready
      - failed
      title: BaselinePhase
    BaselineState:
      type: string
      enum:
      - none
      - measuring
      - ready
      title: BaselineState
    CalibrateResult:
      properties:
        started:
          type: boolean
          title: Started
        seconds:
          type: number
          title: Seconds
          description: 측정에 걸리는 초 (이 동안 바른 자세로 앉기)
      type: object
      required:
      - started
      - seconds
      title: CalibrateResult
    Collapse:
      properties:
        avg_sec:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Sec
          description: '자세 무너짐: 착석 시작 → 첫 비정상 확정 평균 (그날 시작한 구간, null 제외)'
        count:
          type: integer
          title: Count
          description: 평균에 들어간 구간 수
        segments:
          type: integer
          title: Segments
          description: 그날 시작한 착석 구간 수
      type: object
      required:
      - count
      - segments
      title: Collapse
    Confidence:
      properties:
        seat:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Seat
          description: 좌면 판단 확신도 (0~1)
        head:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Head
          description: 목 판단 확신도 (0~1). 카메라 미인식이면 0
        tilt:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Tilt
          description: 기울기 판단 확신도 (0~1). 카메라 미인식이면 0
      type: object
      required:
      - seat
      - head
      - tilt
      title: Confidence
    Cues:
      properties:
        neck_drop:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Neck Drop
        face_grow:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Face Grow
        closer:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Closer
        shoulder_angle:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Shoulder Angle
        head_angle:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Head Angle
        head_offset:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Head Offset
      type: object
      title: Cues
      description: 각 단서가 기준값(threshold)을 넘었는지. 판단할 수 없으면 null
    Current:
      properties:
        ts:
          type: number
          title: Ts
          description: 측정 시각 (time.time() 초)
        seated:
          type: boolean
          title: Seated
          description: 앉아 있는지 (seat_state != empty)
        sitting_since:
          anyOf:
          - type: number
          - type: 'null'
          title: Sitting Since
          description: 이번 연속 착석 시작 시각. 자리 비움이면 null
        state_since:
          type: number
          title: State Since
          description: 지금 자세(좌면·목·기울기)가 시작된 시각
        seat_state:
          $ref: '#/components/schemas/SeatState'
        head_state:
          $ref: '#/components/schemas/HeadState'
        tilt_state:
          $ref: '#/components/schemas/TiltState'
        confidence:
          $ref: '#/components/schemas/Confidence'
        postures:
