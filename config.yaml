# SitSense 설정값
# 코드 안에 숫자를 직접 쓰지 말고 여기서 읽어 쓰기 (common/config.py의 load_config)

mode: mock            # mock: 가짜 센서 / replay: 저장한 CSV 재생 / real: 실제 센서(Pi)
subject: p1           # 데이터 수집할 때 사람 ID (p1, p2, p3 …, 실명 쓰지 않기)

sampling:
  hz: 10              # 1초에 몇 번 센서를 읽을지

pressure:             # FSR 406 × 8 → MCP3008 1개 (8채널)
  n_channels: 8       # 8개로 수집 → feature importance로 6개 선별
  adc_max: 1023       # MCP3008은 10bit (0~1023)
  spi_bus: 0
  spi_device: 0       # CE0
  # 채널별 방석 위치 (사람 기준) x: 왼쪽 -1 ~ 오른쪽 +1, y: 뒤 -1 ~ 앞 +1
  # ⚠️ 임시 배치(2열 × 4행). 하드웨어 팀원의 FSR 배치도가 나오면 실제 위치로 수정
  positions:
    - [-0.5,  0.75]   # p0 앞 왼쪽
    - [ 0.5,  0.75]   # p1 앞 오른쪽
    - [-0.5,  0.25]   # p2
    - [ 0.5,  0.25]   # p3
    - [-0.5, -0.25]   # p4
    - [ 0.5, -0.25]   # p5
    - [-0.5, -0.75]   # p6 뒤 왼쪽 (엉덩이 쪽)
    - [ 0.5, -0.75]   # p7 뒤 오른쪽

distance:             # VL53L1X (적외선 ToF, I2C)
  sensor: vl53l1x
  i2c_bus: 1
  i2c_address: 0x29   # VL53L1X 기본 주소
  range_mode: short   # short: 약 1.3m까지, 주변광에 강함 (우리 범위 40~80cm에 충분)
  timing_budget_ms: 50
  min_mm: 150         # 이보다 가깝거나
  max_mm: 1300        # 멀면 잘못된 값으로 보고 버림
  median_window: 5    # 튀는 값 걸러내기용 중앙값 개수

camera:               # 정면, 모니터 위 (VL53L1X와 함께 설치)
  index: 0            # 맥 웹캠 번호
  width: 1280         # 좌표를 픽셀로 바꿀 때도 사용
  height: 720
  fps: 5              # Pi 4에서는 2~5fps가 현실적

thresholds:
  baseline_seconds: 10      # 세션 시작 후 바른 자세 기준 측정 시간
  distance_ok_mm: 500       # 50cm 이상 적정 — OSHA(50~100cm)·AOA(50~70cm) 권장 하한
  distance_warning_mm: 400  # 40cm 미만 경고 — 고용노동부 VDT 작업관리지침(40cm 이상)
  close_delta_mm: 100       # ⚠️ 임시값, 근거 없음: 기준 거리보다 이만큼 가까워지면 거북목 단서로 사용
  short_filter_sec: 3       # ⚠️ 임시값: 3초 이상 유지돼야 자세로 인정
  long_filter_sec: 30       # ⚠️ 임시값: 30초 이상 유지되면 습관으로 기록

paths:
  raw: data/raw
  synthetic: data/synthetic
  processed: data/processed
  models: ai/models

replay:
  file: null          # 재생할 세션 CSV (예: data/raw/p1_20261015_143012.csv). --file로도 지정 가능
  loop: true          # 파일 끝까지 재생하면 처음부터 다시
