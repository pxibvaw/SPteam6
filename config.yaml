# SitSense 설정값
# 코드 안에 숫자를 직접 쓰지 말고 여기서 읽어 쓰기 (common/config.py의 load_config)

mode: mock            # mock: 가짜 센서 / replay: 저장한 CSV 재생 / real: 실제 센서(Pi)
subject: p1           # 데이터 수집할 때 사람 ID (p1, p2, p3 …, 실명 쓰지 않기)

sampling:
  hz: 2               # 1초에 몇 번 센서를 읽을지 (수집 스크립트와 같은 0.5초 간격)

pressure:             # FSR 406 × 6 → MCP3208 1개 (SPI, CE0)
  adc: mcp3208
  n_channels: 6       # CH2, CH5는 쓰지 않음
  channels: [0, 1, 3, 4, 6, 7]   # 읽는 MCP3208 채널 번호. 순서 = p0, p1, … (CSV 열·positions 순서)
  adc_max: 4095       # MCP3208은 12bit (0~4095)
  spi_bus: 0
  spi_device: 0       # CE0
  # p번호별 방석 위치 (사람 기준) x: 왼쪽 -1 ~ 오른쪽 +1, y: 뒤 -1 ~ 앞 +1
  # 배치 (앞 → 뒤):  CH4  CH2(안 씀)  CH1  /  CH6  CH3  /  CH7  CH5(안 씀)  CH0
  # ⚠️ 좌표는 2열 × 3행 배치를 대략 옮긴 값. 방석 실측 후 수정
  positions:
    - [ 0.5, -0.75]   # p0 = CH0 맨 뒤 오른쪽
    - [ 0.5,  0.75]   # p1 = CH1 맨 앞 오른쪽
    - [ 0.5,  0.0 ]   # p2 = CH3 중간 오른쪽
    - [-0.5,  0.75]   # p3 = CH4 맨 앞 왼쪽
    - [-0.5,  0.0 ]   # p4 = CH6 중간 왼쪽
    - [-0.5, -0.75]   # p5 = CH7 맨 뒤 왼쪽

distance:             # HC-SR04 (초음파, GPIO). Echo는 분압 회로로 3.3V로 낮춰서 연결
  sensor: hc-sr04
  trigger_pin: 23     # BCM 번호 (물리 핀 16)
  echo_pin: 24        # BCM 번호 (물리 핀 18)
  min_mm: 20          # 이보다 가깝거나 (HC-SR04 최소 약 2cm)
  max_mm: 2000        # 멀면 측정 안 된 것으로 보고 빈칸 (수집 스크립트 MAX_DIST_M = 2.0)
  median_window: 5    # 튀는 값 걸러내기용 중앙값 개수 (gpiozero queue_len)

camera:               # 정면, 모니터 위 (HC-SR04와 함께 설치)
  index: 0            # 맥 웹캠 번호
  width: 1280         # 좌표를 픽셀로 바꿀 때도 사용
  height: 720
  fps: 5              # Pi 4에서는 2~5fps가 현실적

thresholds:
  baseline_seconds: 10      # 세션 시작 후 바른 자세 기준 측정 시간
  distance_ok_mm: 500       # 50cm 이상 적정 — OSHA(50~100cm)·AOA(50~70cm) 권장 하한
  distance_warning_mm: 400  # 40cm 미만 경고 — 고용노동부 VDT 작업관리지침(40cm 이상)
  close_delta_mm: 100       # ⚠️ 임시값, 근거 없음: 기준 거리보다 이만큼 가까워지면 거북목 단서로 사용
  short_filter_sec: 3       # ⚠️ 임시값: 3초 이상 유지돼야 자세로 인정
  long_filter_sec: 30       # ⚠️ 임시값: 30초 이상 유지되면 습관으로 기록

paths:
  raw: data/raw
  synthetic: data/synthetic
  processed: data/processed
  models: ai/models

replay:
  file: null          # 재생할 세션 CSV (예: data/raw/p1_20261015_143012.csv). --file로도 지정 가능
  loop: true          # 파일 끝까지 재생하면 처음부터 다시
